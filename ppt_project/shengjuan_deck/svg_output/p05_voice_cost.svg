  <line x1="80" y1="576" x2="1200" y2="576" stroke="#E5E5E5" stroke-width="1"/>
  <text x="80" y="628" font-family="微软雅黑, Arial, sans-serif" font-size="24" fill="#000000" font-weight="bold">音色三合一</text>
