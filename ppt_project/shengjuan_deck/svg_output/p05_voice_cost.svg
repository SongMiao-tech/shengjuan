  <text x="1200" y="96" text-anchor="end" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#8A8A8A">05 / 08</text>
  <rect x="80" y="132" width="56" height="6" fill="#000000"/>
  <text x="80" y="240" font-family="微软雅黑, Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000">设计成本，压到接近零</text>
  <text x="80" y="316" font-family="微软雅黑, Arial, sans-serif" font-size="24" fill="#333333">原本走 MiniMax，一个音色二十多块</text>
  <rect x="80" y="344" width="880" height="40" fill="#D9D9D9"/>
