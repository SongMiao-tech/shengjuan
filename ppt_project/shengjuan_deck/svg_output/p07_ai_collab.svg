<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F5"/>
  <text x="1173" y="76" font-family="Arial" font-size="15" letter-spacing="2" text-anchor="end" fill="#78827D">07 / 08</text>
  <text x="107" y="112" font-family="微软雅黑" font-size="37" font-weight="bold" fill="#2E3238">AI 协作：用在哪、错在哪、怎么合作</text>
  <rect x="107" y="138" width="107" height="4" fill="#4C7A5A"/>

  <line x1="640" y1="186" x2="640" y2="658" stroke="#C8D2CD" stroke-width="1"/>

  <text x="107" y="186" font-family="微软雅黑" font-size="15" font-weight="bold" fill="#4C7A5A">AI 只干两件事 · 其余全是工程实现</text>
  <text x="107" y="222" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold" fill="#4C7A5A">情感分析</tspan><tspan>　读全文，输出分段、情绪、强度、重音词的 JSON</tspan></text>
  <text x="107" y="252" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold" fill="#4C7A5A">智能音色生成</tspan><tspan>　一句话，扩写成配音导演式音色描述</tspan></text>

  <text x="107" y="296" font-family="微软雅黑" font-size="15" font-weight="bold" fill="#8C5A46">三个真踩到的坑</text>
  <text x="107" y="330" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">① JSON 会不合法</tspan><tspan>　带引号对话塞进字符串，十次炸两三次</tspan></text>
  <text x="107" y="358" font-family="微软雅黑" font-size="17" fill="#78827D">　三层防御：强约束 → 整批重试 → 绕开 JSON 兜底</text>
  <text x="107" y="394" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">② 数字算错十倍</tspan><tspan>　它回「四毛钱一万字」，实际 <tspan font-weight="bold" fill="#8C5A46">4.32 元</tspan></tspan></text>
  <text x="107" y="430" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">③ 会误判接口</tspan><tspan>　说是账号问题，<tspan font-weight="bold" fill="#8C5A46">不是账号，是参数</tspan></tspan></text>

  <rect x="107" y="470" width="520" height="80" fill="#E8EEEA"/>
  <text x="155" y="504" font-family="微软雅黑" font-size="17" font-weight="bold" fill="#2E3238">所以默认把 AI 的输出当草稿，</text>
  <text x="155" y="532" font-family="微软雅黑" font-size="17" font-weight="bold" fill="#2E3238">不当答案。</text>

  <text x="667" y="186" font-family="微软雅黑" font-size="15" font-weight="bold" fill="#4C7A5A">能力边界</text>
  <text x="667" y="222" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold" fill="#4C7A5A">可交 AI</tspan><tspan>　结构化标注、文案扩写 —— 错了容易看出来</tspan></text>
  <text x="667" y="252" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold" fill="#8C5A46">必须人工</tspan><tspan>　成本数字、接口契约、最终听感</tspan></text>
  <text x="667" y="282" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">硬线</tspan><tspan>　故事正文禁止 AI 写，全用公版原文</tspan></text>

  <line x1="667" y1="306" x2="1173" y2="306" stroke="#D2DAD5" stroke-width="1"/>

  <text x="667" y="336" font-family="微软雅黑" font-size="15" font-weight="bold" fill="#4C7A5A">四步闭环</text>
  <text x="667" y="372" font-family="微软雅黑" font-size="17" fill="#2E3238">我拆需求 → AI 出代码 → 我评审 → 再迭代</text>
  <text x="667" y="404" font-family="微软雅黑" font-size="17" fill="#2E3238">每版必须实测 —— <tspan font-weight="bold" fill="#4C7A5A">十六条 Playwright 断言全绿</tspan>才敢发</text>

  <line x1="667" y1="428" x2="1173" y2="428" stroke="#D2DAD5" stroke-width="1"/>

  <text x="667" y="458" font-family="微软雅黑" font-size="15" font-weight="bold" fill="#4C7A5A">三轮迭代</text>
  <text x="667" y="492" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">第一轮</tspan><tspan>　跑通链路，能用但粗糙</tspan></text>
  <text x="667" y="522" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">第二轮</tspan><tspan>　补移动端和离线下载</tspan></text>
  <text x="667" y="552" font-family="微软雅黑" font-size="17" fill="#2E3238"><tspan font-size="15" font-weight="bold">第三轮</tspan><tspan>　成本治理：换免费通道、上缓存</tspan></text>

  <rect x="667" y="586" width="506" height="72" fill="#E8EEEA"/>
  <text x="715" y="624" font-family="微软雅黑" font-size="17" font-weight="bold" fill="#2E3238">三轮的改进点，没有一个是 AI 主动提的。</text>
</svg>
