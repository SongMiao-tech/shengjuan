<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#8A8A8A">SHENGJUAN · 课程演示</text>
  <text x="1200" y="96" text-anchor="end" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#8A8A8A">01 / 08</text>
  <rect x="80" y="132" width="56" height="6" fill="#E63946"/>
  <text x="80" y="268" font-family="微软雅黑, Arial, sans-serif" font-size="64" font-weight="bold" fill="#000000">把一段文字，变成</text>
  <text x="80" y="356" font-family="微软雅黑, Arial, sans-serif" font-size="64" font-weight="bold" fill="#000000">一本能听的有声书</text>
  <text x="80" y="452" font-family="微软雅黑, Arial, sans-serif" font-size="26" fill="#333333">它不是又一个 TTS 工具：普通合成整篇语气是平的，该紧张的地方不紧张。</text>
  <text x="80" y="502" font-family="微软雅黑, Arial, sans-serif" font-size="26" fill="#333333">声卷要解决的，就是这股「没有人味」的劲。</text>
  <line x1="1200" y1="132" x2="1200" y2="560" stroke="#E5E5E5" stroke-width="1"/>
  <text x="80" y="648" font-family="微软雅黑, Arial, sans-serif" font-size="16" fill="#8A8A8A">声卷 · 5 分钟汇报</text>
</svg>
