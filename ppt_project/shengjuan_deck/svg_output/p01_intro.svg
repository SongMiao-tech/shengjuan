<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F5"/>
  <rect x="107" y="168" width="8" height="286" fill="#4C7A5A"/>
  <text x="155" y="196" font-family="微软雅黑" font-size="15" font-weight="bold" letter-spacing="3" fill="#4C7A5A">课程项目答辩</text>
  <text x="145" y="300" font-family="微软雅黑" font-size="96" font-weight="bold" fill="#2E3238">声卷</text>
  <text x="155" y="372" font-family="微软雅黑" font-size="29" font-weight="bold" fill="#4A5568">把一段文字，变成一本能听、有情绪、有角色声音的有声书</text>
  <rect x="155" y="405" width="190" height="4" fill="#4C7A5A"/>
  <text x="155" y="460" font-family="微软雅黑" font-size="21" fill="#78827D">不是又一个 TTS 工具。普通合成整篇语气是平的，该紧张的地方不紧张——</text>
  <text x="155" y="496" font-family="微软雅黑" font-size="21" fill="#78827D">声卷要解决的，就是这股「<tspan font-weight="bold" fill="#4C7A5A">没有人味</tspan>」的劲。</text>
  <text x="1173" y="650" font-family="微软雅黑" font-size="15" text-anchor="end" fill="#78827D">声卷 · 5 分钟汇报</text>
</svg>
